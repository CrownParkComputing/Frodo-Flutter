name: Build Windows Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Flutter ───────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # ── Rust ──────────────────────────────────────────────────────────────
      - name: Set up Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artefacts
        uses: actions/cache@v4
        with:
          path: flutter_app/rust/frodo_bridge/target
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('flutter_app/rust/frodo_bridge/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-windows-

      # ── Flutter dependencies ───────────────────────────────────────────────
      - name: flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      # ── Enable Windows desktop ─────────────────────────────────────────────
      - name: Enable Windows desktop target
        run: flutter config --enable-windows-desktop
        working-directory: flutter_app

      # ── Build ─────────────────────────────────────────────────────────────
      # CMake will compile SDL2 from the submodule source, then invoke cargo to
      # build the Rust bridge (which also compiles the Frodo C++ core via cc).
      - name: Build release (Windows)
        working-directory: flutter_app
        run: flutter build windows --release --build-number=${{ github.run_number }}

      # ── Package ───────────────────────────────────────────────────────────
      - name: Zip release artefacts
        shell: pwsh
        run: |
          $src = "flutter_app\build\windows\x64\runner\Release"
          Compress-Archive -Path "$src\*" -DestinationPath frodo-app-windows-x64.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: frodo-app-windows-x64
          path: frodo-app-windows-x64.zip
          retention-days: 5

      # ── Publish to rolling nightly release (push to main only) ────────────
      - name: Publish to nightly release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          make_latest: false
          body: |
            Automated build from commit ${{ github.sha }} on branch `${{ github.ref_name }}`.
          files: frodo-app-windows-x64.zip
