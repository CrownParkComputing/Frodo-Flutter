name: Build Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.0 or v1.0.0
        required: true

permissions:
  contents: write

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          INPUT_VERSION="${{ github.event.inputs.version || '' }}"
          TAG="${GITHUB_REF_NAME}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="$INPUT_VERSION"
          fi

          if [[ -z "$TAG" ]]; then
            echo "No version was provided." >&2
            exit 1
          fi

          if [[ "$TAG" != v* ]]; then
            TAG="v$TAG"
          fi

          VERSION="${TAG#v}"

          if [[ -z "$VERSION" ]]; then
            echo "This workflow must run from or be given a version like v1.2.3." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create GitHub release
    needs: metadata
    runs-on: ubuntu-latest

    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Frodo ${{ needs.metadata.outputs.version }}
          generate_release_notes: true

  android:
    name: Build Android APK
    needs:
      - metadata
      - create-release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 29
        shell: bash
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache Rust build artefacts
        uses: actions/cache@v4
        with:
          path: flutter_app/rust/frodo_bridge/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('flutter_app/rust/frodo_bridge/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      - name: Build SDL2 for Android (arm64-v8a)
        shell: bash
        run: |
          cmake \
            -S flutter_app/third_party/SDL2 \
            -B ${{ runner.temp }}/sdl2-android-build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_shared \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TEST=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build ${{ runner.temp }}/sdl2-android-build --parallel

          mkdir -p flutter_app/android/app/src/main/jniLibs/arm64-v8a
          cp ${{ runner.temp }}/sdl2-android-build/libSDL2*.so \
            flutter_app/android/app/src/main/jniLibs/arm64-v8a/libSDL2.so

      - name: flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Build release APK
        working-directory: flutter_app
        env:
          SDL2_INCLUDE_DIR: ${{ github.workspace }}/flutter_app/third_party/SDL2/include
        run: >-
          flutter build apk --release
          --build-name=${{ needs.metadata.outputs.version }}
          --build-number=${{ github.run_number }}

      - name: Rename APK
        shell: bash
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk \
            frodo-app-${{ needs.metadata.outputs.version }}-android-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: frodo-app-${{ needs.metadata.outputs.version }}-android-arm64
          path: frodo-app-${{ needs.metadata.outputs.version }}-android-arm64.apk
          retention-days: 30

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          files: frodo-app-${{ needs.metadata.outputs.version }}-android-arm64.apk

  windows:
    name: Build Windows Desktop
    needs:
      - metadata
      - create-release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artefacts
        uses: actions/cache@v4
        with:
          path: flutter_app/rust/frodo_bridge/target
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('flutter_app/rust/frodo_bridge/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-windows-

      - name: flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Enable Windows desktop target
        working-directory: flutter_app
        run: flutter config --enable-windows-desktop

      - name: Build release (Windows)
        working-directory: flutter_app
        run: >-
          flutter build windows --release
          --build-name=${{ needs.metadata.outputs.version }}
          --build-number=${{ github.run_number }}

      - name: Zip release artefacts
        shell: pwsh
        run: |
          $src = "flutter_app\build\windows\x64\runner\Release"
          $dest = "frodo-app-${{ needs.metadata.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $dest

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: frodo-app-${{ needs.metadata.outputs.version }}-windows-x64
          path: frodo-app-${{ needs.metadata.outputs.version }}-windows-x64.zip
          retention-days: 30

      - name: Attach Windows build to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          files: frodo-app-${{ needs.metadata.outputs.version }}-windows-x64.zip

  ios:
    name: Build iOS (unsigned)
    needs:
      - metadata
      - create-release
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Rust (stable, iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: Cache Rust build artefacts
        uses: actions/cache@v4
        with:
          path: flutter_app/rust/frodo_bridge/target
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('flutter_app/rust/frodo_bridge/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ios-

      - name: Install SDL2 (headers only via Homebrew)
        run: brew install sdl2

      - name: Set up CocoaPods
        run: |
          gem install cocoapods --no-document
          pod --version

      - name: flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Build iOS (no-codesign)
        working-directory: flutter_app
        env:
          SDL2_INCLUDE_DIR: ${{ github.workspace }}/flutter_app/third_party/SDL2/include
        run: >-
          flutter build ios --release --no-codesign
          --build-name=${{ needs.metadata.outputs.version }}
          --build-number=${{ github.run_number }}

      - name: Zip Runner.app
        shell: bash
        run: |
          cd flutter_app/build/ios/iphoneos
          zip -r "${GITHUB_WORKSPACE}/frodo-app-${{ needs.metadata.outputs.version }}-ios-unsigned.zip" Runner.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: frodo-app-${{ needs.metadata.outputs.version }}-ios-unsigned
          path: frodo-app-${{ needs.metadata.outputs.version }}-ios-unsigned.zip
          retention-days: 30

      - name: Attach iOS build to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          files: frodo-app-${{ needs.metadata.outputs.version }}-ios-unsigned.zip
